<head>
  <meta charset="utf-8">
  <!-- <link href="https://gmpg.org/xfn/11" rel="profile"> -->
  <!-- <meta http-equiv="X-UA-Compatible" content="IE=edge"> -->
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ description | default: site.description | default: title }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  {% unless site.isProd %}
  <meta name="robots" content="noindex, nofollow">
  {% endunless %}

  <title>
    {{site.title}} - {{title}}
  </title>

  <!-- CSS -->
  <!-- Critical, same-origin CSS: kept render-blocking on purpose to avoid a flash of unstyled content -->
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/style.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/post-element-condesed.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/dark-mode.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/badge.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Non-critical CSS: Font Awesome icons and syntax-highlight theme don't block first paint -->
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
    crossorigin="anonymous" referrerpolicy="no-referrer" onload="this.onload=null;this.rel='stylesheet'">
  <!-- Syntax highlight  -->
  <link id="prism-css" rel="preload" as="style" href="https://unpkg.com/prismjs@1.20.0/themes/prism.css"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/prismjs@1.20.0/themes/prism.css">
  </noscript>
  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144"
    href="{{ site.baseurl }}/public/apple-touch-icon-precomposed.png" defer>
  <!-- <link rel="shortcut icon" href="{{ site.baseurl }}/public/favicon.ico"> -->

  <!-- ////////// Favicon ////////// -->
  <!-- For old IEs -->
  <link rel="shortcut icon" href="{{ site.baseurl }}/public/favicon.ico/favicon.ico" async>
  <!-- For new browsers - multisize ico  -->
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32" href="{{ site.baseurl }}/public/favicon.ico/favicon.ico"
    async>
  <!-- For iPad with high-resolution Retina display running iOS ≥ 7: -->
  <link rel="apple-touch-icon-precomposed" sizes="152x152" href="{{ site.baseurl }}/public/favicon.ico/favicon-152.png"
    async>
  <!-- For iPad with high-resolution Retina display running iOS ≤ 6: -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ site.baseurl }}/public/favicon.ico/favicon-144.png"
    async>
  <!-- For iPhone with high-resolution Retina display running iOS ≥ 7: -->
  <link rel="apple-touch-icon-precomposed" sizes="120x120" href="{{ site.baseurl }}/public/favicon.ico/favicon-120.png"
    async>
  <!-- For iPhone with high-resolution Retina display running iOS ≤ 6: -->
  <link rel="apple-touch-icon-precomposed" sizes="114x114" href="{{ site.baseurl }}/public/favicon.ico/favicon-114.png"
    async>
  <!-- For iPhone 6+ -->
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="{{ site.baseurl }}/public/favicon.ico/favicon-180.png"
    async>
  <!-- For first- and second-generation iPad: -->
  <link rel="apple-touch-icon-precomposed" sizes="72x72" href="{{ site.baseurl }}/public/favicon.ico/favicon-72.png"
    async>
  <!-- For non-Retina iPhone, iPod Touch, and Android 2.1+ devices: -->
  <link rel="apple-touch-icon-precomposed" href="{{ site.baseurl }}/public/favicon.ico/favicon-57.png" async>
  <!-- For Old Chrome -->
  <link rel="icon" href="{{ site.baseurl }}/public/favicon.ico/favicon-32.png" sizes="32x32" async>
  <!-- For IE10 Metro -->
  <meta name="msapplication-TileColor" content="#FFFFFF">
  <meta name="msapplication-TileImage" content="favicon-144.png" async>
  <meta name="theme-color" content="#ffffff">
  <!-- Chrome for Android -->
  <link rel="manifest" href="{{ site.baseurl }}/manifest.json">
  <link rel="icon" sizes="192x192" href="{{ site.baseurl }}/public/favicon.ico/favicon-192.png" async>
  <!-- ////////// Favicons end ////////// -->


  <!--  -->
  <!-- Open graph -->
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description | default: site.description | default: title }}">
  <meta property="og:type" content="article">
  <meta property="og:image" content="{{ site.url }}{{ image | default: site.owner.image }}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="675" />
  <!-- Twitter -->
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@{{site.owner.twitter}}">
  <meta name="twitter:description" content="{{ description | default: site.description | default: title }}">
  <meta name="twitter:image" content="{{ site.url }}{{ image | default: site.owner.image }}">
  <meta name="twitter:creator" content="@{{site.owner.twitter}}">

  <!-- Structured data for entity/profile disambiguation -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.owner.name }} {{ site.owner.last_name }}",
    "url": "{{ site.url }}",
    "email": "{{ site.owner.email }}",
    "sameAs": [
      "https://uk.linkedin.com/in/{{ site.owner.linkedin }}",
      "https://github.com/{{ site.owner.github }}",
      "https://twitter.com/{{ site.owner.twitter }}",
      "https://www.instagram.com/{{ site.owner.instagram }}",
      "https://www.facebook.com/{{ site.owner.facebook }}",
      "https://www.youtube.com/c/{{ site.owner.youtube }}",
      "https://vimeo.com/{{ site.owner.vimeo }}",
      "https://www.imdb.com/name/{{ site.owner.imdb }}/",
      "https://source.opennews.org/people/{{ site.owner.opennews }}/"
    ],
    "subjectOf": "{{ site.url }}/press.html",
    "award": "Guardian Student Media Awards 2015 — Student Media Startup of the Year, for quickQuote"
  }
  </script>

  {% if github and github != 'pietrop/' %}
  <!-- Structured data for software project authorship -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": {{ title | jsonify }},
    "description": {{ description | default: title | jsonify }},
    "url": "{{ site.url }}{{ page.url }}",
    "codeRepository": "{% if github contains 'http' %}{{ github }}{% else %}https://github.com/{{ github }}{% endif %}",
    "dateCreated": "{{ date | date: '%Y-%m-%d' }}",
    "author": {
      "@type": "Person",
      "name": "{{ site.owner.name }} {{ site.owner.last_name }}",
      "url": "{{ site.url }}"
    }{% if tech %},
    "keywords": {{ tech | join: ", " | jsonify }}{% endif %}
  }
  </script>
  {% endif %}

  <!--  -->

  {% if site.isProd %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.tracking.gtag }}">
  </script>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', '{{ site.tracking.gtag }}');
  </script>

  {% endif %}

</head>
